[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellcollective-reduction"
version = "0.1.0"
description = "Reproducible Boolean network reduction experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["dd==0.6.0", "z3-solver==5.1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
